[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kms-paramstore"
version = "0.1.0"
description = "Python SDK for the KMS parameter store and secret management service"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suhaib" }]
keywords = ["kms", "secrets", "parameter-store", "grpc", "configuration"]
dependencies = [
    # The vendored stubs hard-fail at import on older runtimes: kms_pb2_grpc.py
    # requires grpcio >= 1.83.0 and kms_pb2.py validates protobuf >= 7.35.1.
    # Keep these lower bounds in sync when regenerating the stubs.
    "grpcio>=1.83.0",
    "protobuf>=7.35.1,<8",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.83.0",
    "pytest>=9.1.1",
    "mypy>=2.3.1",
]

[project.urls]
Homepage = "https://github.com/Suhaibinator/kms"
Source = "https://github.com/Suhaibinator/kms/tree/main/sdk/python"

[tool.setuptools.packages.find]
where = ["."]
include = ["kms_paramstore*"]

[tool.setuptools.package-data]
"kms_paramstore" = ["py.typed"]
"kms_paramstore._gen" = ["*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
files = ["kms_paramstore"]
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true
# The generated protobuf/gRPC stubs are not authored to be type-clean.
exclude = ['kms_paramstore/_gen/']

[[tool.mypy.overrides]]
module = "kms_paramstore._gen.*"
ignore_errors = true
