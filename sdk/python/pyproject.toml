[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0", "grpcio-tools==1.85.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kms-paramstore"
version = "0.3.0"
description = "Python SDK for the KMS parameter store and secret management service"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Suhaib" }]
keywords = ["kms", "secrets", "parameter-store", "grpc", "configuration"]
# Runtime minimums come from the generated protobuf/gRPC version guards.
dynamic = ["dependencies"]

[project.scripts]
kms-config-gen-py = "kms_paramstore.configgen.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=9.1.1",
    "mypy>=2.3.1",
]

[project.urls]
Homepage = "https://github.com/Suhaibinator/kms"
Source = "https://github.com/Suhaibinator/kms/tree/main/sdk/python"

[tool.setuptools.packages.find]
where = ["."]
include = ["kms_paramstore*"]

[tool.setuptools.package-data]
"kms_paramstore" = ["py.typed"]
"kms_paramstore._gen" = ["*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
files = ["kms_paramstore"]
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true
# The generated protobuf/gRPC stubs are not authored to be type-clean.
exclude = ['kms_paramstore/_gen/']

[[tool.mypy.overrides]]
module = "kms_paramstore._gen.*"
ignore_errors = true
