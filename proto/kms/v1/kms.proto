syntax = "proto3";

package kms.v1;

option go_package = "github.com/Suhaibinator/kms/gen/kmsv1";

// ---------------------------------------------------------------------------
// Common types
// ---------------------------------------------------------------------------
//
// A namespace is a fixed (env, app) pair and the unit of ownership,
// authorization, and auth-method policy. Parameters and secrets live inside a
// namespace and are addressed by a relative key. The server never parses a
// "/env/app/key" path string: callers always send the namespace and key as
// separate, explicit fields. The slash-joined form survives only as a display
// convenience in SDKs, the CLI, logs, and the frontend.

// NamespaceRef identifies a namespace by its (env, app) pair. Both fields are
// required and validated (1-64 chars of [a-z0-9-], no leading/trailing '-').
message NamespaceRef {
  string env = 1; // deployment environment, e.g. "prod"
  string app = 2; // application, e.g. "gradethis"
}

// ResourceRef addresses one parameter or secret: its namespace plus a relative
// key. The key may contain interior '/' (e.g. "billing/stripe-key") but those
// slashes are part of the name, never namespace structure.
message ResourceRef {
  NamespaceRef namespace = 1; // owning namespace
  string key = 2;             // relative key within the namespace
}

// Parameter is a non-sensitive configuration value.
message Parameter {
  ResourceRef ref = 1;     // namespace + relative key
  string value = 2;
  string content_type = 3; // string | integer | float | boolean | json | binary
  uint64 version = 4;
  string metadata_json = 5;
  string created_by = 6;
  int64 created_at_unix_ms = 7;
  map<string, uint64> labels = 8; // label -> version, e.g. current -> 3
}

// ParameterVersionInfo describes one immutable parameter version (no value).
message ParameterVersionInfo {
  uint64 version = 1;
  string content_type = 2;
  string state = 3; // enabled | disabled
  string created_by = 4;
  int64 created_at_unix_ms = 5;
  string metadata_json = 6;
}

// SecretMetadata never contains plaintext.
message SecretMetadata {
  ResourceRef ref = 1; // namespace + relative key
  string content_type = 2;
  bool client_bound = 3;
  bool has_access_token = 4;
  string metadata_json = 5;
  int64 created_at_unix_ms = 6;
  int64 updated_at_unix_ms = 7;
  map<string, uint64> labels = 8; // label -> version
  repeated SecretVersionInfo versions = 9;
}

message SecretVersionInfo {
  uint64 version = 1;
  string state = 2; // enabled | disabled | destroyed
  string created_by = 3;
  int64 created_at_unix_ms = 4;
  int64 destroyed_at_unix_ms = 5;
  int64 expires_at_unix_ms = 6;
  string metadata_json = 7;
}

// ---------------------------------------------------------------------------
// ParameterService
// ---------------------------------------------------------------------------

service ParameterService {
  rpc GetParameter(GetParameterRequest) returns (GetParameterResponse);
  rpc PutParameter(PutParameterRequest) returns (PutParameterResponse);
  rpc ListParameters(ListParametersRequest) returns (ListParametersResponse);
  rpc DeleteParameter(DeleteParameterRequest) returns (DeleteParameterResponse);
  rpc GetParameterMetadata(GetParameterMetadataRequest) returns (GetParameterMetadataResponse);
}

message GetParameterRequest {
  ResourceRef ref = 1;
  // Exactly one of version/label may be set; both empty means label "current".
  uint64 version = 2;
  string label = 3;
}

message GetParameterResponse {
  Parameter parameter = 1;
}

message PutParameterRequest {
  ResourceRef ref = 1;
  string value = 2;
  string content_type = 3; // defaults to "string"
  string metadata_json = 4;
}

message PutParameterResponse {
  uint64 version = 1;
  uint64 revision = 2;
}

// ListParameters is always namespace-scoped. key_prefix optionally narrows to
// keys under a prefix; empty lists every key in the namespace.
message ListParametersRequest {
  NamespaceRef namespace = 1;
  string key_prefix = 2;
  int32 page_size = 3;   // default 100, max 1000
  string page_token = 4;
}

message ListParametersResponse {
  repeated Parameter parameters = 1;
  string next_page_token = 2;
}

message DeleteParameterRequest {
  ResourceRef ref = 1;
}

message DeleteParameterResponse {
  uint64 revision = 1;
}

message GetParameterMetadataRequest {
  ResourceRef ref = 1;
}

message GetParameterMetadataResponse {
  ResourceRef ref = 1;
  string content_type = 2;
  string metadata_json = 3;
  int64 created_at_unix_ms = 4;
  int64 updated_at_unix_ms = 5;
  map<string, uint64> labels = 6;
  repeated ParameterVersionInfo versions = 7;
}

// ---------------------------------------------------------------------------
// SecretService
// ---------------------------------------------------------------------------
//
// Authentication travels in gRPC metadata:
//   "authorization":      "Bearer <per-client token>"
//   "x-kms-secret-token": "<per-secret access token>"  (when required / client-bound)

service SecretService {
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  rpc DisableSecret(DisableSecretRequest) returns (DisableSecretResponse);
  rpc DestroySecretVersion(DestroySecretVersionRequest) returns (DestroySecretVersionResponse);
  rpc GetSecretMetadata(GetSecretMetadataRequest) returns (GetSecretMetadataResponse);
  rpc PromoteSecretVersion(PromoteSecretVersionRequest) returns (PromoteSecretVersionResponse);
}

message GetSecretRequest {
  ResourceRef ref = 1;
  uint64 version = 2; // 0 = use label
  string label = 3;   // default "current"
}

message GetSecretResponse {
  ResourceRef ref = 1;
  uint64 version = 2;
  bytes value = 3;
  string content_type = 4;
  string metadata_json = 5;
  int64 created_at_unix_ms = 6;
}

message PutSecretRequest {
  ResourceRef ref = 1;
  bytes value = 2;
  string content_type = 3;
  string metadata_json = 4;
  // client_bound opts this secret into client-bound double wrapping. Only
  // honored on first creation; later puts must match the existing mode.
  bool client_bound = 5;
  // generate_access_token asks the server to mint a per-secret access token.
  // The token is returned exactly once in the response. Required (or an
  // existing token supplied via metadata) when client_bound is true.
  bool generate_access_token = 6;
  // expires_at for the new version, 0 = never.
  int64 expires_at_unix_ms = 7;
}

message PutSecretResponse {
  uint64 version = 1;
  uint64 revision = 2;
  // access_token is set only when generate_access_token was true. It is never
  // retrievable again.
  string access_token = 3;
}

// ListSecrets is always namespace-scoped and returns metadata only, never
// plaintext. key_prefix optionally narrows to keys under a prefix.
message ListSecretsRequest {
  NamespaceRef namespace = 1;
  string key_prefix = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListSecretsResponse {
  repeated SecretMetadata secrets = 1; // metadata only, never values
  string next_page_token = 2;
}

message DeleteSecretRequest {
  ResourceRef ref = 1;
}

message DeleteSecretResponse {
  uint64 revision = 1;
}

message DisableSecretRequest {
  ResourceRef ref = 1;
  uint64 version = 2; // 0 = all versions
  bool enable = 3;    // true = re-enable instead of disable
}

message DisableSecretResponse {
  uint64 revision = 1;
}

message DestroySecretVersionRequest {
  ResourceRef ref = 1;
  uint64 version = 2;
}

message DestroySecretVersionResponse {
  uint64 revision = 1;
}

message GetSecretMetadataRequest {
  ResourceRef ref = 1;
}

message GetSecretMetadataResponse {
  SecretMetadata secret = 1;
}

message PromoteSecretVersionRequest {
  ResourceRef ref = 1;
  uint64 version = 2; // version to become "current"
}

message PromoteSecretVersionResponse {
  uint64 current_version = 1;
  uint64 previous_version = 2;
  uint64 revision = 3;
}

// ---------------------------------------------------------------------------
// WatchService
// ---------------------------------------------------------------------------

service WatchService {
  // Subscribe is the hot-reload mechanism. The client declares the namespaces
  // it wants and its last-applied revision; the server streams an initial
  // snapshot (or delta), then pushes EVERY change in those namespaces the
  // caller is authorized for, interleaved with heartbeats. Authorization is
  // checked once per namespace at registration; there is no key-level
  // filtering — a subscriber to a namespace receives all of its changes and
  // routes them client-side.
  rpc Subscribe(stream SubscribeRequest) returns (stream SubscribeEvent);
}

// ---------------------------------------------------------------------------
// ConfigurationReleaseService
// ---------------------------------------------------------------------------

// Configuration releases are immutable namespace-scoped manifests. They
// contain exact parameter/secret version references and non-sensitive
// metadata only; values and secret access tokens are never embedded.
service ConfigurationReleaseService {
  rpc CreateRelease(CreateReleaseRequest) returns (CreateReleaseResponse);
  rpc ValidateRelease(ValidateReleaseRequest) returns (ValidateReleaseResponse);
  rpc ActivateRelease(ActivateReleaseRequest) returns (ActivateReleaseResponse);
  rpc GetRelease(GetReleaseRequest) returns (GetReleaseResponse);
  rpc GetActiveRelease(GetActiveReleaseRequest) returns (GetActiveReleaseResponse);
  rpc ListReleases(ListReleasesRequest) returns (ListReleasesResponse);
  rpc WatchRelease(stream WatchReleaseRequest) returns (stream WatchReleaseEvent);
}

// ReleaseEntrySelector is accepted only when creating a release. Exactly one
// of version/label may be set; both empty resolves label "current". The server
// persists the resolved exact version in ConfigurationReleaseEntry.
message ReleaseEntrySelector {
  string alias = 1;
  string kind = 2; // parameter | secret
  ResourceRef ref = 3;
  uint64 version = 4;
  string label = 5;
}

message ConfigurationReleaseEntry {
  string alias = 1;
  string kind = 2; // parameter | secret
  ResourceRef ref = 3;
  uint64 version = 4;
  string content_type = 5;
  string metadata_json = 6;
  // SHA-256 hex digest of the exact parameter bytes. Empty for secrets.
  string parameter_digest = 7;
  bool client_bound = 8;
  bool has_access_token = 9;
}

message ConfigurationRelease {
  NamespaceRef namespace = 1;
  string name = 2;
  uint64 version = 3;
  string schema_id = 4;
  uint64 schema_version = 5;
  repeated ConfigurationReleaseEntry entries = 6;
  string digest = 7;
  string metadata_json = 8;
  string created_by = 9;
  int64 created_at_unix_ms = 10;
}

message CreateReleaseRequest {
  NamespaceRef namespace = 1;
  string name = 2;
  string schema_id = 3;
  uint64 schema_version = 4;
  repeated ReleaseEntrySelector entries = 5;
  string metadata_json = 6;
}

message CreateReleaseResponse {
  ConfigurationRelease release = 1;
}

message ValidateReleaseRequest {
  NamespaceRef namespace = 1;
  string name = 2;
  uint64 version = 3;
}

message ReleaseValidationError {
  string alias = 1;        // empty for release-level errors
  string code = 2;         // bounded machine-readable category
  string schema_pointer = 3;
  string message = 4;      // sanitized; never contains resource values
}

message ValidateReleaseResponse {
  bool valid = 1;
  repeated ReleaseValidationError errors = 2;
}

message ActivateReleaseRequest {
  NamespaceRef namespace = 1;
  string name = 2;
  uint64 version = 3;
  // Presence distinguishes an omitted guard from "expect no active release".
  optional uint64 expected_current_version = 4;
}

message ActivateReleaseResponse {
  ConfigurationRelease release = 1;
  uint64 current_version = 2;
  uint64 previous_version = 3;
  uint64 activation_revision = 4;
  bool changed = 5;
}

message GetReleaseRequest {
  NamespaceRef namespace = 1;
  string name = 2;
  uint64 version = 3;
}

message GetReleaseResponse {
  ConfigurationRelease release = 1;
}

message GetActiveReleaseRequest {
  NamespaceRef namespace = 1;
  string name = 2;
}

message GetActiveReleaseResponse {
  ConfigurationRelease release = 1;
  uint64 activation_revision = 2;
  uint64 previous_version = 3;
}

message ListReleasesRequest {
  NamespaceRef namespace = 1;
  string name = 2; // empty lists every release name in the namespace
  int32 page_size = 3;
  string page_token = 4;
}

message ReleaseSummary {
  ConfigurationRelease release = 1;
  bool current = 2;
  bool previous = 3;
  uint64 activation_revision = 4;
}

message ListReleasesResponse {
  repeated ReleaseSummary releases = 1;
  string next_page_token = 2;
}

message ReleaseWatchRegistration {
  NamespaceRef namespace = 1;
  string name = 2;
  string client_name = 3;
  string instance_id = 4;
  uint64 last_seen_revision = 5;
}

message ReleaseAcknowledgement {
  NamespaceRef namespace = 1;
  string name = 2;
  uint64 version = 3;
  uint64 activation_revision = 4;
  string client_name = 5;
  string instance_id = 6;
  string state = 7;              // received | prepared | applied | rejected
  string rejection_category = 8;
  string diagnostic = 9;         // bounded, redacted application text
  int64 timestamp_unix_ms = 10;
}

message WatchReleaseRequest {
  oneof request {
    ReleaseWatchRegistration register = 1;
    ReleaseAcknowledgement acknowledgement = 2;
  }
}

message ReleaseSnapshotEvent {
  ConfigurationRelease release = 1;
}

message ReleaseActivationEvent {
  ConfigurationRelease release = 1;
}

message WatchReleaseEvent {
  oneof event {
    ReleaseSnapshotEvent snapshot = 1;
    ReleaseActivationEvent activation = 2;
    Heartbeat heartbeat = 3;
  }
  // Global changelog revision assigned by activation.
  uint64 revision = 4;
}

// ---------------------------------------------------------------------------
// ConfigurationSchemaService
// ---------------------------------------------------------------------------

service ConfigurationSchemaService {
  rpc CreateSchema(CreateSchemaRequest) returns (CreateSchemaResponse);
  rpc GetSchema(GetSchemaRequest) returns (GetSchemaResponse);
  rpc ListSchemas(ListSchemasRequest) returns (ListSchemasResponse);
}

message ConfigurationSchema {
  string id = 1;
  uint64 version = 2;
  string schema_json = 3;
  string digest = 4;
  string metadata_json = 5;
  string created_by = 6;
  int64 created_at_unix_ms = 7;
}

message CreateSchemaRequest {
  string id = 1;
  string schema_json = 2;
  string metadata_json = 3;
}

message CreateSchemaResponse {
  ConfigurationSchema schema = 1;
}

message GetSchemaRequest {
  string id = 1;
  uint64 version = 2;
}

message GetSchemaResponse {
  ConfigurationSchema schema = 1;
}

message ListSchemasRequest {
  string id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListSchemasResponse {
  repeated ConfigurationSchema schemas = 1;
  string next_page_token = 2;
}

message SubscribeRequest {
  // First message: subscription registration.
  string client_name = 1;              // e.g. "gradethis-be"
  repeated NamespaceRef namespaces = 2; // the namespaces to watch
  uint64 last_seen_revision = 3;       // 0 = send full snapshot
  // Subsequent messages: acks / heartbeat responses.
  uint64 acked_revision = 4;
}

message SubscribeEvent {
  oneof event {
    Snapshot snapshot = 1;
    ParameterChange change = 2;
    SecretMetadataChange secret_change = 3;
    Heartbeat heartbeat = 4;
  }
  uint64 revision = 5; // global, monotonically increasing
}

message Snapshot {
  repeated Parameter parameters = 1;
}

message ParameterChange {
  ResourceRef ref = 1;
  string change_type = 2; // put | delete | label
  string value = 3;       // new value for put
  string content_type = 4;
  uint64 version = 5;
  string label = 6; // for label moves
}

// SecretMetadataChange notifies subscribers that a secret changed. Plaintext is
// never pushed over the stream; clients refetch through GetSecret.
message SecretMetadataChange {
  ResourceRef ref = 1;
  string change_type = 2; // put | delete | promote | disable | enable | destroy
  uint64 version = 3;
  string label = 4;
}

message Heartbeat {
  int64 server_time_unix_ms = 1;
}

// ---------------------------------------------------------------------------
// AdminService
// ---------------------------------------------------------------------------

service AdminService {
  rpc CreateNamespace(CreateNamespaceRequest) returns (CreateNamespaceResponse);
  rpc UpdateNamespace(UpdateNamespaceRequest) returns (UpdateNamespaceResponse);
  rpc DeleteNamespace(DeleteNamespaceRequest) returns (DeleteNamespaceResponse);
  rpc ListNamespaces(ListNamespacesRequest) returns (ListNamespacesResponse);
  rpc CreatePolicy(CreatePolicyRequest) returns (CreatePolicyResponse);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (UpdatePolicyResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc CreateIdentity(CreateIdentityRequest) returns (CreateIdentityResponse);
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse);
  rpc RevokeIdentity(RevokeIdentityRequest) returns (RevokeIdentityResponse);
  rpc RotateIdentityToken(RotateIdentityTokenRequest) returns (RotateIdentityTokenResponse);
  rpc IssueIdentityCertificate(IssueIdentityCertificateRequest) returns (IssueIdentityCertificateResponse);
  rpc RevokeIdentityCertificate(RevokeIdentityCertificateRequest) returns (RevokeIdentityCertificateResponse);
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  rpc GetCACertificate(GetCACertificateRequest) returns (GetCACertificateResponse);
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse);
  rpc ListSubscribers(ListSubscribersRequest) returns (ListSubscribersResponse);
  rpc ListReleaseSubscribers(ListReleaseSubscribersRequest) returns (ListReleaseSubscribersResponse);
  rpc ApplyApplicationDefaults(ApplyApplicationDefaultsRequest) returns (ApplyApplicationDefaultsResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}

// Namespace is the (env, app) entity plus its settings and cheap COUNT-joined
// child totals for the dashboard.
message Namespace {
  NamespaceRef ref = 1;
  string description = 2;
  repeated string allowed_auth_methods = 3; // "mtls" | "token"
  string created_by = 4;
  int64 created_at_unix_ms = 5;
  uint64 parameter_count = 6;
  uint64 secret_count = 7;
}

// CertBundle carries a freshly issued client certificate. The private key is
// generated server-side and returned here exactly once; it is never stored.
message CertBundle {
  string cert_pem = 1;
  string key_pem = 2;
  string serial = 3;
  int64 not_after_unix_ms = 4;
}

// IdentityCertInfo summarizes an issued certificate (never the private key).
message IdentityCertInfo {
  string serial = 1;
  string fingerprint = 2;          // sha256 of DER, for display/pinning
  int64 not_after_unix_ms = 3;
  int64 revoked_at_unix_ms = 4;    // 0 = valid
  int64 created_at_unix_ms = 5;
}

message Identity {
  string name = 1;
  string kind = 2; // client | admin
  bool disabled = 3;
  int64 created_at_unix_ms = 4;
  NamespaceRef namespace = 5;          // unset = unbound (admin/tooling)
  bool has_token = 6;
  repeated IdentityCertInfo certs = 7; // issued-cert summaries
}

message CreateNamespaceRequest {
  NamespaceRef ref = 1;
  string description = 2;
  // allowed_auth_methods defaults server-side to ["mtls"] when empty.
  repeated string allowed_auth_methods = 3;
}

message CreateNamespaceResponse {
  Namespace namespace = 1;
}

// UpdateNamespace replaces the description and allowed_auth_methods wholesale
// (full replace, not a merge).
message UpdateNamespaceRequest {
  NamespaceRef ref = 1;
  string description = 2;
  repeated string allowed_auth_methods = 3;
}

message UpdateNamespaceResponse {
  Namespace namespace = 1;
}

// DeleteNamespace only succeeds when the namespace is empty (no parameters, no
// secrets, no bound identities).
message DeleteNamespaceRequest {
  NamespaceRef ref = 1;
}

message DeleteNamespaceResponse {}

message ListNamespacesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListNamespacesResponse {
  repeated Namespace namespaces = 1;
  string next_page_token = 2;
}

// ApplyApplicationDefaults previews or atomically applies a parameter-only
// kms-config-defaults/v1 artifact. Secret values are structurally absent from
// both the artifact contract and this API.
message ApplyApplicationDefaultsRequest {
  NamespaceRef namespace = 1;
  bytes artifact = 2;
  bool overwrite = 3;
  bool execute = 4;
  string plan_digest = 5;
}

message DefaultsApplyEntry {
  string alias = 1;
  string key = 2;
  string content_type = 3;
  string status = 4; // create | unchanged | update | blocked
  uint64 current_version = 5;
  uint64 applied_version = 6;
  uint64 revision = 7;
}

message ApplyApplicationDefaultsResponse {
  string profile = 1;
  string schema_sha256 = 2;
  string artifact_digest = 3;
  string plan_digest = 4;
  repeated DefaultsApplyEntry entries = 5;
  repeated string missing_secrets = 6;
  bool executed = 7;
}

// PolicyRule grants or denies one operation on a whole namespace. Authorization
// is namespace-level: there is no per-key scoping.
message PolicyRule {
  string operation = 1; // e.g. "secret:read", "parameter:*", "*"
  string env = 2;       // exact env or "*"
  string app = 3;       // exact app or "*"
}

message Policy {
  string name = 1;
  string subject = 2; // identity name, or "*" for all clients
  repeated PolicyRule allow = 3;
  repeated PolicyRule deny = 4;
  int64 created_at_unix_ms = 5;
  int64 updated_at_unix_ms = 6;
}

message CreatePolicyRequest {
  Policy policy = 1;
}

message CreatePolicyResponse {
  Policy policy = 1;
}

message UpdatePolicyRequest {
  Policy policy = 1; // matched by name
}

message UpdatePolicyResponse {
  Policy policy = 1;
}

message DeletePolicyRequest {
  string name = 1;
}

message DeletePolicyResponse {}

message ListPoliciesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListPoliciesResponse {
  repeated Policy policies = 1;
  string next_page_token = 2;
}

message CreateIdentityRequest {
  string name = 1;
  string kind = 2; // client | admin
  // namespace optionally binds a client identity to a namespace (unset =
  // unbound). Binding enables the implicit home-namespace grant.
  NamespaceRef namespace = 3;
  // auth_methods selects which credentials to mint: "mtls" (a cert bundle) and
  // /or "token". Empty defaults server-side.
  repeated string auth_methods = 4;
  // cert_ttl_seconds sets the lifetime of the minted cert when "mtls" is
  // requested; 0 uses the server default (90 days).
  int64 cert_ttl_seconds = 5;
}

message CreateIdentityResponse {
  Identity identity = 1;
  // token is returned exactly once and never retrievable again. Present only
  // when "token" was among the requested auth_methods.
  string token = 2;
  // cert is a one-time PEM bundle, present only when "mtls" was requested.
  CertBundle cert = 3;
}

message ListIdentitiesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListIdentitiesResponse {
  repeated Identity identities = 1;
  string next_page_token = 2;
}

message RevokeIdentityRequest {
  string name = 1;
}

message RevokeIdentityResponse {}

message RotateIdentityTokenRequest {
  string name = 1;
}

message RotateIdentityTokenResponse {
  string token = 1; // returned exactly once
}

// IssueIdentityCertificate mints a new client certificate for an existing
// identity. Multiple concurrent valid certs allow zero-downtime rollover.
message IssueIdentityCertificateRequest {
  string name = 1;
  int64 ttl_seconds = 2; // 0 = server default (90 days)
}

message IssueIdentityCertificateResponse {
  CertBundle cert = 1; // one-time PEM bundle
}

// RevokeIdentityCertificate revokes a single certificate by serial. Revoking
// the identity (or disabling it) invalidates all of its certs.
message RevokeIdentityCertificateRequest {
  string name = 1;
  string serial = 2;
}

message RevokeIdentityCertificateResponse {}

// WhoAmI returns the calling identity as resolved from its credential. It is
// callable by any authenticated identity with no policy check, and is the
// SDK's namespace-discovery mechanism.
message WhoAmIRequest {}

message WhoAmIResponse {
  string name = 1;
  string kind = 2;             // client | admin
  NamespaceRef namespace = 3;  // unset = unbound
  string auth_method = 4;      // mtls | token
}

// GetCACertificate returns the built-in client CA's public certificate for
// inspection and out-of-band validation of KMS-issued client certificates. It
// is not the server TLS trust root. Callable without authentication.
message GetCACertificateRequest {}

message GetCACertificateResponse {
  string cert_pem = 1;
}

message AuditEvent {
  int64 id = 1;
  string event_type = 2;
  string actor_identity = 3;
  string actor_type = 4;
  string resource_type = 5;
  string resource_env = 6; // denormalized; readable after namespace deletion
  string resource_app = 7;
  string resource_key = 8;
  uint64 resource_version = 9;
  string decision = 10; // allow | deny | error
  string source_ip = 11;
  string user_agent = 12;
  string request_id = 13;
  int64 created_at_unix_ms = 14;
  string metadata_json = 15;
}

message ListAuditEventsRequest {
  string env = 1;        // exact env filter, empty = any
  string app = 2;        // exact app filter, empty = any
  string key_prefix = 3; // key prefix filter, empty = any
  string actor_identity = 4;
  string event_type = 5;
  int64 from_unix_ms = 6;
  int64 to_unix_ms = 7;
  int32 page_size = 8;
  string page_token = 9;
}

message ListAuditEventsResponse {
  repeated AuditEvent events = 1;
  string next_page_token = 2;
}

message Subscriber {
  string client_name = 1;
  string instance_id = 2;
  string identity = 3;
  repeated NamespaceRef namespaces = 4; // the namespaces this stream is watching
  string remote_addr = 5;
  int64 connected_at_unix_ms = 6;
  int64 last_heartbeat_unix_ms = 7;
  uint64 last_acked_revision = 8;
}

message ListSubscribersRequest {}

message ListSubscribersResponse {
  repeated Subscriber subscribers = 1;
  uint64 current_revision = 2;
}

message ReleaseSubscriberState {
  NamespaceRef namespace = 1;
  string release_name = 2;
  string client_name = 3;
  string instance_id = 4;
  string identity = 5;
  string state = 6;
  uint64 release_version = 7;
  uint64 activation_revision = 8;
  string rejection_category = 9;
  string diagnostic = 10;
  int64 client_timestamp_unix_ms = 11;
  int64 server_timestamp_unix_ms = 12;
  bool connected = 13;
}

message ListReleaseSubscribersRequest {
  NamespaceRef namespace = 1;
  string release_name = 2;
  int32 page_size = 3;
  string page_token = 4;
}

message ListReleaseSubscribersResponse {
  repeated ReleaseSubscriberState subscribers = 1;
  string next_page_token = 2;
  uint64 current_revision = 3;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  bool ready = 2;
  string version = 3;
  uint64 current_revision = 4;
  string details_json = 5;
}
