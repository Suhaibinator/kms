name: CI

# Pre-merge checks for the parameter-store service. Every job must pass before
# a pull request is merged (enforce via branch protection: require these
# status checks). Jobs run in parallel and are independent.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A new push to a PR cancels the previous, still-running CI for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    name: Go lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  go-test:
    name: Go build & unit tests (race)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Unit tests with race detector and coverage
        run: make test-unit GO_TEST_TIMEOUT=15m GO_TEST_FLAGS='-race -covermode=atomic -coverprofile=coverage.out'
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  # Keep integration tests as a distinct required status. The suite owns its
  # real SQLite/key material and any loopback listeners, so CI needs no service
  # containers, cloud credentials, or network dependencies beyond module setup.
  go-integration:
    name: Go integration tests (race)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Integration tests with race detector and coverage
        run: make test-integration GO_TEST_TIMEOUT=15m GO_TEST_FLAGS='-race -covermode=atomic -coverprofile=integration-coverage.out'
      - name: Coverage summary
        run: go tool cover -func=integration-coverage.out | tail -1

  # Linux cannot execute the build-tagged Darwin ACL and Windows DACL tests.
  # Native runners make those security regressions observable rather than only
  # proving that the platform-specific source cross-compiles.
  filesystem-security:
    name: Native filesystem security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run native permission and ACL tests
        run: go test ./internal/fileutil ./internal/crypto ./internal/storage ./internal/cli -count=1 -timeout=10m

  go-vuln:
    name: Go vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # Run the official tool directly rather than golang/govulncheck-action,
      # whose bundled checkout breaks on current runners
      # ("Duplicate header: Authorization"). This keeps us on the latest
      # first-party actions and the latest govulncheck.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  python-sdk:
    name: Python SDK (pytest & mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: Install SDK with dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Type-check (mypy)
        run: mypy
      - name: Test (pytest)
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck & build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build static export
        run: npm run build
      - name: Verify static export produced an entry point
        run: test -f out/index.html || { echo "::error::frontend build did not produce out/index.html"; exit 1; }
