name: CI

# Pre-merge checks for the parameter-store service. Every job must pass before
# a pull request is merged (enforce via branch protection: require these
# status checks). Jobs run in parallel and are independent.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A new push to a PR cancels the previous, still-running CI for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    name: Go lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  go-test:
    name: Go build & test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test with race detector and coverage
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  go-vuln:
    name: Go vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Run the official tool directly rather than golang/govulncheck-action,
      # whose bundled checkout breaks on current runners
      # ("Duplicate header: Authorization"). This keeps us on the latest
      # first-party actions and the latest govulncheck.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  python-sdk:
    name: Python SDK (pytest & mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK with dev dependencies
        run: pip install -e '.[dev]'
      - name: Type-check (mypy)
        run: mypy
      - name: Test (pytest)
        run: pytest -q

  frontend:
    name: Frontend (typecheck & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Build static export
        run: npm run build
      - name: Verify static export produced an entry point
        run: test -f out/index.html || { echo "::error::frontend build did not produce out/index.html"; exit 1; }
