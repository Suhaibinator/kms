name: CI

# Pre-merge checks for the parameter-store service. Every job must pass before
# a pull request is merged (enforce via branch protection: require these
# status checks). Jobs run in parallel and are independent.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A new push to a PR cancels the previous, still-running CI for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    name: Go lint (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  go-checks:
    name: Go module, generated, vet & build checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Verify go.mod / go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy; run 'go mod tidy' and commit the result"; exit 1; }
      - name: Verify generated configuration artifacts
        run: make check-configgen
      - name: go vet
        run: go vet ./...
      - name: Build
        run: go build ./...

  go-unit:
    name: Go unit shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [configgen, cli-storage, remaining]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Unit tests with race detector and coverage
        run: >-
          make test-unit-shard
          GO_TEST_SHARD='${{ matrix.shard }}'
          GO_TEST_TIMEOUT=15m
          GO_TEST_FLAGS='-race -covermode=atomic -coverprofile=coverage-${{ matrix.shard }}.out'
      - name: Store shard coverage
        uses: actions/upload-artifact@v7
        with:
          name: go-unit-coverage-${{ matrix.shard }}
          path: coverage-${{ matrix.shard }}.out
          if-no-files-found: error
          retention-days: 1

  # Keep one stable required status while the implementation fans out across
  # matrix jobs. Shards own disjoint packages, so their profiles can be joined
  # without double-counting coverage blocks.
  go-unit-gate:
    name: Go build & unit tests (race)
    if: always()
    needs: [go-checks, go-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Require checks and every unit shard
        if: needs.go-checks.result != 'success' || needs.go-unit.result != 'success'
        run: |
          echo "::error::Go checks=${{ needs.go-checks.result }}, unit shards=${{ needs.go-unit.result }}"
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Download shard coverage
        uses: actions/download-artifact@v8
        with:
          pattern: go-unit-coverage-*
          path: coverage-shards
          merge-multiple: true
      - name: Combine coverage and print summary
        shell: bash
        run: |
          mapfile -t profiles < <(find coverage-shards -type f -name 'coverage-*.out' | sort)
          if [ "${#profiles[@]}" -ne 3 ]; then
            echo "::error::expected 3 Go unit coverage profiles, found ${#profiles[@]}"
            exit 1
          fi
          {
            echo 'mode: atomic'
            for profile in "${profiles[@]}"; do
              if [ "$(head -n 1 "$profile")" != 'mode: atomic' ]; then
                echo "::error::$profile does not use atomic coverage mode" >&2
                exit 1
              fi
              tail -n +2 "$profile"
            done
          } >coverage.out
          go tool cover -func=coverage.out | tail -1

  # Keep integration tests as a distinct required status. The suite owns its
  # real SQLite/key material and any loopback listeners, so CI needs no service
  # containers, cloud credentials, or network dependencies beyond module setup.
  go-integration:
    name: Go integration tests (race)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download Go modules
        run: go mod download
      - name: Integration tests with race detector and coverage
        run: make test-integration GO_TEST_TIMEOUT=15m GO_TEST_FLAGS='-race -covermode=atomic -coverprofile=integration-coverage.out'
      - name: Require exercised production coverage
        run: make check-integration-coverage INTEGRATION_COVERAGE_PROFILE=integration-coverage.out

  # The Linux variants already run in the race-enabled unit shards. Native
  # macOS and Windows runners make the build-tagged ACL/DACL regressions
  # observable rather than only proving that their source cross-compiles.
  filesystem-security:
    name: Native filesystem security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run native permission and ACL tests
        run: go test ./internal/fileutil ./internal/crypto ./internal/storage ./internal/cli -count=1 -timeout=10m
      - name: Require Windows reparse-entry DACL regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testName = 'TestRequireStableParentInspectsReparseEntryDACL'
          $json = @(& go test ./internal/fileutil -run "^$testName`$" -count=1 -timeout=2m -json)
          $goTestExit = $LASTEXITCODE
          $events = @($json | ForEach-Object { ConvertFrom-Json -InputObject $_ })
          $events |
            Where-Object { $_.Action -eq 'output' } |
            ForEach-Object { Write-Host -NoNewline $_.Output }
          if ($goTestExit -ne 0) {
            throw "go test failed with exit code $goTestExit"
          }
          $testEvents = @($events | Where-Object { $_.Test -eq $testName })
          $skipEvents = @($testEvents | Where-Object { $_.Action -eq 'skip' })
          if ($skipEvents.Count -ne 0) {
            throw "$testName skipped; this security regression must run"
          }
          $passEvents = @($testEvents | Where-Object { $_.Action -eq 'pass' })
          if ($passEvents.Count -ne 1) {
            throw "$testName did not emit exactly one passing test event"
          }

  go-vuln:
    name: Go vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # Run the official tool directly rather than golang/govulncheck-action,
      # whose bundled checkout breaks on current runners
      # ("Duplicate header: Authorization"). This keeps us on the latest
      # first-party actions and the latest govulncheck.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  python-sdk:
    name: Python SDK (pytest & mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdk/python/pyproject.toml
      - name: Install SDK with dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Type-check (mypy)
        run: mypy
      - name: Check generated protobuf bindings
        run: python scripts/check_generated.py
      - name: Check protocol coverage
        run: python scripts/check_protocol_coverage.py
      - name: Test (pytest)
        run: python -m pytest -q

  typescript-sdk:
    name: TypeScript SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/typescript
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Generated contract, quality, tests, consumer types, and build
        run: npm run check

  typescript-sdk-compatibility:
    name: TypeScript SDK (compiler minimum & Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Build declarations for minimum-compiler consumption
        run: npm run build
      - name: TypeScript 5.2 declaration consumer
        run: npm run test:typescript-min
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Next client real-browser behavior
        run: npm run test:browser

  typescript-sdk-next-peers:
    name: TypeScript SDK (Next ${{ matrix.next }} / React ${{ matrix.react }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdk/typescript
    strategy:
      fail-fast: false
      matrix:
        include:
          - next: 14.2.35
            react: 18.3.1
          - next: 15.5.25
            react: 18.3.1
          - next: 15.5.25
            react: 19.1.9
          - next: 16.3.4
            react: 18.3.1
          - next: 16.3.4
            react: 19.2.8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install locked SDK dependencies
        run: npm ci
      - name: Build SDK declarations
        run: npm run build
      - name: Qualify exact server/client peer tuple in isolation
        run: node scripts/test-next-peer.mjs ${{ matrix.next }} ${{ matrix.react }}

  frontend:
    name: Frontend (quality, tests & build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit tests
        run: npm run test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e
      - name: Build static export
        run: npm run build
      - name: Verify static export produced an entry point
        run: test -f out/index.html || { echo "::error::frontend build did not produce out/index.html"; exit 1; }
